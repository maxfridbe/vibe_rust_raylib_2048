name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (Deb, RPM, AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl pkg-config git \
            cmake clang libclang-dev libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            rpm wget file desktop-file-utils

      - name: Install Cargo Tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build Release Binary
        run: |
          cargo build --release

      - name: Build Debian Package (.deb)
        run: |
          mkdir -p dist
          cargo deb --output dist/

      - name: Build RPM Package (.rpm)
        run: |
          cargo generate-rpm
          mv target/generate-rpm/*.rpm dist/

      - name: Build AppImage
        run: |
          # Create AppDir structure
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/raylib2048/assets
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications

          cp target/release/raylib2048 AppDir/usr/bin/
          cp -r assets/* AppDir/usr/share/raylib2048/assets/

          # Create desktop file
          cat > AppDir/usr/share/applications/raylib2048.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Raylib 2048
          Exec=raylib2048
          Icon=raylib2048
          Categories=Game;
          Terminal=false
          EOF

          # Fetch Icon (Using Raylib logo as placeholder)
          wget -q -O AppDir/usr/share/icons/hicolor/256x256/apps/raylib2048.png https://raw.githubusercontent.com/raysan5/raylib/master/logo/raylib_256x256.png

          # Get LinuxDeploy
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

          # Extract linuxdeploy (avoid FUSE issues in CI)
          ./linuxdeploy --appimage-extract > /dev/null

          # Run LinuxDeploy
          ./squashfs-root/AppRun --appdir AppDir --output appimage \
            --desktop-file AppDir/usr/share/applications/raylib2048.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/raylib2048.png

          mv *.AppImage dist/

      - name: Prepare Artifacts
        run: |
          # Copy binary and assets
          cp target/release/raylib2048 dist/
          cp -r assets dist/

          # Copy scripts and README
          cp setup_env_deb.sh dist/
          cp test_setup_env_deb.sh dist/
          cp README.md dist/
          
          # Create tarball
          cd dist
          tar -czvf raylib2048-linux-x86_64.tar.gz raylib2048 assets setup_env_deb.sh test_setup_env_deb.sh README.md
          
          # Cleanup raw files
          rm raylib2048
          rm -rf assets
          rm setup_env_deb.sh test_setup_env_deb.sh README.md
          cd ..

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "target\release\raylib2048.exe" -Destination "dist\"
          Copy-Item -Path "assets" -Destination "dist\" -Recurse
          Copy-Item -Path "README.md" -Destination "dist\"
          
          cd dist
          Compress-Archive -Path "raylib2048.exe", "assets", "README.md" -DestinationPath "raylib2048-windows-x86_64.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/raylib2048-windows-x86_64.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.zip
          generate_release_notes: true
