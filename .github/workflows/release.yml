name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          chmod +x setup_env_deb.sh
          ./setup_env_deb.sh

      - name: Build Release
        run: |
          source $HOME/.cargo/env || true
          cargo build --release

      - name: Create Artifact Archive
        run: |
          mkdir -p dist
          cp target/release/raylib2048 dist/
          cp setup_env_deb.sh dist/
          cp test_setup_env_deb.sh dist/
          cp README.md dist/
          # Include assets folder if necessary for the game to run relative to binary
          if [ -d "assets" ]; then
            cp -r assets dist/
          fi
          
          cd dist
          tar -czvf ../raylib2048-linux-x86_64.tar.gz *
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: raylib2048-linux-x86_64.tar.gz
          generate_release_notes: true
