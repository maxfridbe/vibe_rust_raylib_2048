name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all:
    name: Build All Platforms (Linux & Windows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl pkg-config git \
            cmake clang libclang-dev libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            rpm wget file desktop-file-utils

      - name: Install Cargo Tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build Linux Artifacts (Deb, RPM, AppImage)
        run: |
          # 1. Build release binary
          cargo build --release
          
          # 2. Build packages
          mkdir -p dist
          cargo deb --output dist/
          cargo generate-rpm
          mv target/generate-rpm/*.rpm dist/

          # 3. Build AppImage
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/raylib2048/assets AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          cp target/release/raylib2048 AppDir/usr/bin/
          cp -r assets/* AppDir/usr/share/raylib2048/assets/
          cat > AppDir/usr/share/applications/raylib2048.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Raylib 2048
          Exec=raylib2048
          Icon=raylib2048
          Categories=Game;
          Terminal=false
          EOF
          wget -q -O AppDir/usr/share/icons/hicolor/256x256/apps/raylib2048.png https://raw.githubusercontent.com/raysan5/raylib/master/logo/raylib_256x256.png
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract > /dev/null
          ./squashfs-root/AppRun --appdir AppDir --output appimage \
            --desktop-file AppDir/usr/share/applications/raylib2048.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/raylib2048.png
          mv *.AppImage dist/

      - name: Build Windows Artifacts (Zip & Installer)
        run: |
          chmod +x test_build_win.sh
          ./test_build_win.sh

      - name: Prepare Linux Tarball
        run: |
          # Create a tarball containing the Linux binary, assets, and scripts
          # Note: We use a temp dir to avoid including the other dist artifacts in the tarball
          mkdir -p dist_tmp
          cp target/release/raylib2048 dist_tmp/
          cp -r assets dist_tmp/
          cp setup_env_deb.sh test_setup_env_deb.sh README.md dist_tmp/
          
          cd dist_tmp
          tar -czvf ../dist/raylib2048-linux-x86_64.tar.gz *
          cd ..
          rm -rf dist_tmp

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts
          path: dist/*

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-all
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: all-artifacts
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.zip
            dist/*.exe
          generate_release_notes: true