[package]
name = "raylib2048"
version = "0.1.0"
edition = "2021"
description = "A 2048 game clone written in Rust with Raylib"
license = "MIT"
authors = ["maxfridbe"]
repository = "https://github.com/maxfridbe/raylib2048"

[dependencies]
rand = "0.9.2"
raylib = "5.5.1"

[package.metadata.deb]
maintainer = "maxfridbe <maxfridbe@example.com>"
copyright = "2026, maxfridbe"
depends = "$auto"
assets = [
    ["target/release/raylib2048", "usr/bin/", "755"],
    ["assets/*", "usr/share/raylib2048/assets/", "644"]
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/raylib2048", dest = "/usr/bin/raylib2048", mode = "755" },
    { source = "assets/*", dest = "/usr/share/raylib2048/assets", mode = "644" }
]

